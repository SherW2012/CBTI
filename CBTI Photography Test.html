// ─── 余弦相似度 ───────────────────────────────────────────────────────────────
function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  if (na === 0 || nb === 0) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

// ─── 计算结果 ──────────────────────────────────────────────────────────────────
function calcResult(answers) {
  // 累加分值
  const scores = Object.fromEntries(DIM.map(d => [d, 0]));
  let xzBoost = 0;

  QUESTIONS.forEach((q, i) => {
    const sel = answers[i];
    if (!sel) return;
    const opt = q.options.find(o => o.key === sel);
    if (!opt) return;
    Object.entries(opt.scoring).forEach(([dim, val]) => { scores[dim] = (scores[dim] || 0) + val; });
    if (opt.xzBoost) xzBoost += opt.xzBoost;
  });

  // 用户向量（人格层6 + 题材层6）
  const userVec = DIM.map(d => scores[d] || 0);
  // 拆分为人格(0-5)和题材(6-11)
  const userP = userVec.slice(0, 6);
  const userS = userVec.slice(6);

  // 与12型计算加权相似度
  const sims = {};
  Object.entries(PROTOS).forEach(([type, proto]) => {
    const protoP = proto.slice(0, 6);
    const protoS = proto.slice(6);
    const simP = cosineSim(userP, protoP);
    const simS = cosineSim(userS, protoS);
    sims[type] = simP * 0.7 + simS * 0.3;
  });

  // 排序
  const sorted = Object.entries(sims).sort((a, b) => b[1] - a[1]);
  const topSim = sorted[0][1];
  const secondSim = sorted[1][1];

  const finalSorted = Object.entries(sims).sort((a, b) => b[1] - a[1]);
  const topType = finalSorted[0][0];
  const top3 = finalSorted.slice(0, 3).map(([t, s]) => ({ type: t, sim: s }));

  return { type: topType, top3, scores, userVec };
}

      </p>

      <div style={{
        display:'flex', gap:0, marginBottom:44,
        background:'var(--surface)', borderRadius:'var(--radius)',
        border:'1px solid oklch(91% 0.012 72)', overflow:'hidden', boxShadow:'var(--shadow)',
      }}>
        {[{num:'24',label:'道题目'},{num:'12',label:'种人格'},{num:'5′',label:'完成时间'}].map((item,i) => (
          <div key={i} style={{ flex:1, padding:'20px 12px', textAlign:'center', borderRight: i<2 ? '1px solid oklch(91% 0.012 72)' : 'none' }}>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:22, color:'var(--ink)', marginBottom:4 }}>{item.num}</div>
            <div style={{ fontSize:11, color:'var(--ink3)', letterSpacing:'0.04em' }}>{item.label}</div>
          </div>
        ))}
      </div>

      <button
        onClick={onStart}
        style={{
          height:56, borderRadius:14, border:'none',
          background:'linear-gradient(135deg, oklch(65% 0.1 68), oklch(58% 0.1 62))',
          color:'white', fontSize:17, fontFamily:"'Noto Serif SC', serif",
          fontWeight:500, letterSpacing:'0.06em', cursor:'pointer',
          boxShadow:'0 6px 24px oklch(62% 0.1 65 / 0.38)',
          transition:'all 0.25s',
        }}
        onMouseEnter={e => { e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow='0 10px 32px oklch(62% 0.1 65 / 0.45)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='0 6px 24px oklch(62% 0.1 65 / 0.38)'; }}
      >
        开始测试
      </button>
      <p style={{ textAlign:'center', marginTop:14, fontSize:12, color:'var(--ink3)', letterSpacing:'0.03em' }}>答案仅供参考，享受过程</p>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('intro');
  const [currentQ, setCurrentQ] = useState(0);
  const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));
  const [resultData, setResultData] = useState(null);

  function handleStart() {
    setCurrentQ(0);
    setAnswers(Array(QUESTIONS.length).fill(null));
    setScreen('quiz');
  }
  function handleAnswer(key) {
    setAnswers(prev => { const next = [...prev]; next[currentQ] = key; return next; });
  }
  function handleNext() {
    if (!answers[currentQ]) return;
    if (currentQ === QUESTIONS.length - 1) {
      setResultData(calcResult(answers));
      setScreen('result');
    } else {
      setCurrentQ(q => q + 1);
    }
  }

  return (
    <div style={{ maxWidth:480, margin:'0 auto', minHeight:'100vh', background:'var(--bg)' }}>
      {screen === 'intro' && <IntroPage onStart={handleStart} />}
      {screen === 'quiz' && (
        <QuizPage
          key={currentQ}
          question={QUESTIONS[currentQ]}
          questionNum={currentQ + 1}
          total={QUESTIONS.length}
          selectedAnswer={answers[currentQ]}
          onAnswer={handleAnswer}
          onNext={handleNext}
        />
      )}
      {screen === 'result' && <ResultPage resultData={resultData} onRetry={handleStart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
