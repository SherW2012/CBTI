function cosineSim(a, b) {
  let dot=0, na=0, nb=0;
  for (let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}
  return na===0||nb===0 ? 0 : dot/(Math.sqrt(na)*Math.sqrt(nb));
}

function calcResult(answers) {
  // 各维度理论最高积分（24题全选该维度最优解）
  const DIM_MAX = {E:24,T:31,S:20,M:23,A:32,R:27,P:25,ST:31,L:20,W:8,D:14,C:16};

  // 累加原始得分
  const rawScores = Object.fromEntries(DIM.map(d=>[d,0]));
  QUESTIONS.forEach((q,i)=>{
    const sel=answers[i]; if(!sel) return;
    const opt=q.options.find(o=>o.key===sel); if(!opt) return;
    Object.entries(opt.scoring).forEach(([d,v])=>{ rawScores[d]=(rawScores[d]||0)+v; });
  });

  // 归一化用户向量：每维度 ÷ 该维度上限，消除天花板差距对方向的干扰
  const normVec = DIM.map(d=>(rawScores[d]||0)/DIM_MAX[d]);
  const normP = normVec.slice(0,6), normS = normVec.slice(6);

  const sims = {};
  Object.entries(PROTOS).forEach(([t,proto])=>{
    sims[t] = cosineSim(normP,proto.slice(0,6))*0.7 + cosineSim(normS,proto.slice(6))*0.3;
  });
  const sorted = Object.entries(sims).sort((a,b)=>b[1]-a[1]);
  // 返回 rawScores 用于 DimBars 展示，归一化仅用于匹配
  return { type: sorted[0][0], top3: sorted.slice(0,3).map(([t,s])=>({type:t,sim:s})), scores: rawScores };
}

function ProgressBar({ current, total }) {

  return (
    <div style={{padding:'28px 28px 0'}}>
      <div style={{position:'relative',height:3,background:'oklch(88% 0.012 70)',borderRadius:99,overflow:'visible'}}>

        <div style={{position:'absolute',top:-3.5,left:'calc('+pct+'% - 5px)',width:10,height:10,borderRadius:'50%',background:'var(--accent)',border:'2px solid var(--surface)',boxShadow:'0 0 0 3px oklch(62% 0.09 65 / 0.2)',transition:'left 0.6s cubic-bezier(0.4,0,0.2,1)',opacity:pct>0?1:0}}/>

          {String(current).padStart(2,'0')} / {String(total).padStart(2,'0')}

    </div>
  );
}

      </div>

        {text}

// ─── QuizPage ─────────────────────────────────────────────────────────────────
function QuizPage({ question, questionNum, total, selectedAnswer, onAnswer, onNext }) {
  const canNext = selectedAnswer !== null;
  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <ProgressBar current={questionNum} total={total}/>
      <div key={'q'+question.id} style={{padding:'36px 28px 24px',animation:'fadeUp 0.35s ease both'}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:'0.14em',color:'var(--accent)',textTransform:'uppercase',marginBottom:14}}>
          Q{String(questionNum).padStart(2,'0')}
        </div>
        <h2 style={{fontSize:21,fontWeight:500,lineHeight:1.65,color:'var(--ink)',letterSpacing:'0.02em',textWrap:'pretty'}}>
          {question.text}
        </h2>
      </div>
      <div key={'o'+question.id} style={{flex:1,padding:'0 18px',display:'flex',flexDirection:'column',gap:9}}>
        {question.options.map((opt,i)=>(
          <div key={opt.key} style={{animation:'fadeUp 0.35s ease both',animationDelay:(0.05+i*0.07)+'s'}}>
            <OptionCard optKey={opt.key} text={opt.text} selected={selectedAnswer===opt.key} onClick={()=>onAnswer(opt.key)}/>
          </div>
        ))}
      </div>
      <div style={{padding:'24px 18px 36px'}}>
        <button onClick={onNext} disabled={!canNext} style={{width:'100%',height:52,borderRadius:14,border:'none',background:canNext?'linear-gradient(135deg,oklch(65% 0.1 68),oklch(58% 0.1 62))':'oklch(90% 0.01 72)',color:canNext?'white':'var(--ink3)',fontSize:15.5,fontFamily:"'Noto Serif SC',serif",fontWeight:500,letterSpacing:'0.06em',cursor:canNext?'pointer':'not-allowed',transition:'all 0.25s',boxShadow:canNext?'0 4px 20px oklch(62% 0.1 65 / 0.32)':'none'}}
          onMouseEnter={e=>{if(canNext)e.currentTarget.style.transform='translateY(-2px)';}}
          onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';}}>
          {questionNum===total?'查看我的摄影人格':'下一题'}
        </button>
      </div>
    </div>
  );
}

// ─── DimBars ──────────────────────────────────────────────────────────────────
function DimBars({ scores }) {
  const dims=[{key:'E',label:'情绪表达',max:20},{key:'T',label:'技术掌控',max:20},{key:'S',label:'社交取向',max:15},{key:'M',label:'机动轻便',max:15},{key:'A',label:'仪式审美',max:20},{key:'R',label:'稳定保守',max:15}];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {dims.map(d=>{
        const val=scores[d.key]||0, pct=Math.min(100,(val/d.max)*100);
        return (
          <div key={d.key}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink2)',marginBottom:5}}>
              <span>{d.label}</span>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:'var(--ink3)'}}>{val}</span>
            </div>
            <div style={{height:5,background:'oklch(91% 0.012 72)',borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,var(--accent-border),var(--accent))',borderRadius:99,transition:'width 1s cubic-bezier(0.4,0,0.2,1)'}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('intro');
  const [currentQ, setCurrentQ] = useState(0);
  const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));
  const [resultData, setResultData] = useState(null);

  function handleStart() { setCurrentQ(0); setAnswers(Array(QUESTIONS.length).fill(null)); setScreen('quiz'); }
  function handleAnswer(key) { setAnswers(prev=>{ const n=[...prev]; n[currentQ]=key; return n; }); }
  function handleNext() {
    if (!answers[currentQ]) return;
    if (currentQ===QUESTIONS.length-1) { setResultData(calcResult(answers)); setScreen('result'); }
    else setCurrentQ(q=>q+1);
  }

  return (
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>
      {screen==='intro' && <IntroPage onStart={handleStart}/>}
      {screen==='quiz' && <QuizPage key={currentQ} question={QUESTIONS[currentQ]} questionNum={currentQ+1} total={QUESTIONS.length} selectedAnswer={answers[currentQ]} onAnswer={handleAnswer} onNext={handleNext}/>}
      {screen==='result' && <ResultPage resultData={resultData} onRetry={handleStart}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
