<script type="text/babel">
const { useState, useEffect } = React;

const DIM = ['E','T','S','M','A','R','P','ST','L','W','D','C'];
const DIM_MAX = {E:24,T:31,S:20,M:23,A:32,R:27,P:25,ST:31,L:20,W:8,D:14,C:16};

const PROTOS = {
  FUJI:       [5,2,3,4,5,3, 5,4,3,1,4,2],
  CANON:      [3,3,5,3,3,5, 5,2,4,1,2,2],
  SONY:       [2,5,3,3,2,4, 3,3,3,2,2,5],
  NIKON:      [2,4,2,2,2,5, 2,2,4,5,1,1],
  LEICA:      [4,2,1,4,5,2, 2,5,2,1,2,1],
  HASSELBLAD: [3,3,1,1,5,3, 4,1,4,1,5,1],
  OLYMPUS:    [4,2,3,5,3,3, 3,3,5,3,2,2],
  RICOH:      [4,2,1,5,4,2, 5,2,2,1,2,1],
  APPLE:      [4,1,5,5,3,2, 5,3,4,1,2,4],
  ANDROID:    [1,1,2,5,1,3, 3,2,4,1,1,2],
  DJI:        [2,5,2,3,4,3, 1,1,5,3,1,3],
  XZLWC:     [3,3,3,3,3,3, 3,3,3,3,3,3],
};

const TYPES = {
  FUJI:{name:'富士型',en:'FUJI',tag:'氛围感制造者',line:'你不是在拍照，你是在收集今天的空气。',desc:'情绪是你的第一语言。天光、颜色、某种说不清的氛围——这些才是你真正在按快门的理由。你讨厌把拍照搞得太严肃，最好的一张永远是不经意间的那一张。',long:'你属于"以感觉先行"的拍摄者。一张照片打动你的从来不是参数和构图理论，而是当时空气里的味道。你对色彩极度敏感，对光线的方向有近乎本能的判断，但你又拒绝把这些总结成方法论——一旦变成方法，那种东西就死了。\n\n你最舒服的状态是带着相机闲晃，没有计划，没有任务，看到什么有触动就拍下来。你的相册里有大量「为什么拍它」无法回答的照片，但每一张你都说得出当时的情绪。修图你会调，但调得克制，因为你怕调过头就把那种空气感弄丢了。\n\n你不太适合接需要硬指标的拍摄任务，但在没有压力的题材里，你的成片率高得惊人——因为你拍的本来就是你在意的东西。',traits:['情绪感知力强','生活美学家','直出即满足'],color:'oklch(82% 0.06 60)',p:{name:'岩倉しおり',handle:'@iwakurashiori',bio:'Instagram 37万+  ·  日本新生代胶片感摄影师'},mbti:['INFP','ISFP'],mbtiNote:'内向、感性、对美和情绪的捕捉远胜于对系统的兴趣——和富士型的"色彩第一、感觉先行"几乎是同一个内核的两个版本。'},
  CANON:{name:'佳能型',en:'CANON',tag:'人见人爱的出片机器',line:'你的人生信条是：既然拍了，那就得好看。',desc:'你不执着于小众，也不追求怪奇，你只是真的很在意成片质量。拍人是你的本能，让对方满意是你的成就感来源。你的相册里没有失败作，只有不够好的备选。',long:'你是那种"在场就一定不会让大家失望"的人。朋友聚会、旅行合照、家人想要的全家福，最后总会落到你手里——而你确实拍得比别人好。你享受这种"拍人让人开心"的反馈循环，它甚至构成了你拍照动力的一大半。\n\n你研究器材，但你研究的核心是出片质量，不是参数本身；你看后期教程，但你学的是"让人皮肤更好"而不是"让画面更艺术"。你心里有一条很稳的标准线：清楚、好看、人显瘦、肤色对、表情自然。这条线很多自称专业的人未必稳得住。\n\n你不擅长极端风格，也不太追求实验，但你拍的人像有一种安心感——被你拍的人会觉得"这就是我最好看的样子"，这是很多更"艺术"的摄影师做不到的事。',traits:['高出片率','人像天赋','稳定可靠'],color:'oklch(80% 0.07 30)',p:{name:'SamAlive 樊為聖',handle:'@samalive',bio:'Instagram 41万+  ·  东京/台北旅行人像摄影师'},mbti:['ESFJ','ENFJ'],mbtiNote:'外向、关心人、擅长照顾他人感受——这种人格在按快门时天然就会想"对方会不会喜欢这张"，所以人像出片率极高。'},
  SONY:{name:'索尼型',en:'SONY',tag:'全能系统玩家',line:'你拍照像开项目，目标明确，流程清晰，设备必须跟上。',desc:'你相信工具决定上限，所以你研究功能、比对性能、追求全能。你对摄影的态度带着一点任务感——不是不享受，是你更享受一切在掌控之中的感觉。',long:'你看待摄影的方式，和别人看待自己工作流的方式很像——什么环节是瓶颈，什么环节可以提速，哪一档设备能解决哪一类问题，你都门儿清。你不是冷漠，只是真的觉得"先把工具玩明白"是更高效的路径。\n\n你的硬盘里大概率分文件夹按项目归档，参数、镜头、机身机型清清楚楚。你愿意为一个具体目标买一只镜头，但你绝不会为"看起来很酷"花一分冤枉钱。你常常是朋友圈里那个被问"我该买什么相机"的人，而你的回答永远要先反问"你拍什么"。\n\n你最大的风险不是拍不好，是太理性反而拍少了——所有题材你都能拍，但很少有一类题材让你愿意完全沉进去。',traits:['工具思维','高效理性','全能覆盖'],color:'oklch(60% 0.04 240)',p:{name:'影视飓风 Tim',handle:'B站 800万+',bio:'中国头部影像科技博主  ·  Sony深度用户'},mbti:['INTJ','ENTJ'],mbtiNote:'理性、目标导向、相信系统能解决问题——和索尼型把摄影当工程来玩的态度高度一致。'},
  NIKON:{name:'尼康型',en:'NIKON',tag:'沉默的精准主义者',line:'你不一定最会说，但你大概率真的拍到了那只鸟。',desc:'你不喜欢虚头巴脑，重视的是拍到和拍准。你有耐心，能扛器材，能蹲守，能等光线，能在别人放弃的时候还在那里。你的照片不靠运气。',long:'你身上有一种很多人没有的耐心。能在一个地方等几个小时，能扛着重设备走半天，能为了等一只鸟换三个机位——你会觉得这是常识，但其实大多数人做不到。\n\n你不太追求"风格独特"，你追求的是"拍准了"。你心里有一条很硬的底线：拍糊了不算数，拍偏了不算数，对焦没在眼睛上不算数。这条底线让你看起来挑剔，其实只是因为你比大部分人更尊重"按下快门"这个动作的份量。\n\n你不在社交平台上活跃，因为你拍的东西不是用来发的，是用来留的。你的成长曲线很慢但很稳——五年后回头看，你比那些天天换风格的人走得远得多。',traits:['精准耐心','长焦猎手','扎实可信'],color:'oklch(55% 0.05 220)',p:{name:'顾俊',handle:'B站 60万+ / 小红书',bio:'国内知名打鸟/野生动物摄影博主  ·  Nikon Z9用户'},mbti:['ISTJ','ISTP'],mbtiNote:'务实、低调、靠耐心和方法做事——尼康型在野外蹲守几小时只为一张清晰对焦的状态，几乎是这两种人格的本能反应。'},
  LEICA:{name:'徕卡型',en:'LEICA',tag:'带立场的观察者',line:'你拍下的不是场面，是立场。',desc:'你在意的从来不只是拍到什么，而是怎么看这个世界。你偏爱慢一点、少一点、准一点——不是装，是真的觉得一张对的比十张凑合的更值得。',long:'你拍照不是为了记录某个事件，而是为了表达自己怎么看这个事件。这听起来抽象，但落到具体的拍摄选择上很清楚——你会为了一个角度走十分钟，为了一个光线等半小时，为了一张照片少拍二十张。\n\n你对"按下快门"这件事有近乎洁癖的尊重。你不会乱拍，你拍的每一张都带着一点你的判断在里面。你看待街头不是看到了什么人和事，你看到的是构图、关系和那种说不清的「这一刻有意义」。\n\n你的风险是容易陷入审美自我证明——拍得太"对"反而失去了一点松弛感。但当你状态对的时候，你拍出来的东西是有重量的。这种重量不是技术给的，是你站在那里时整个人的态度给的。',traits:['审美自觉','克制精准','城市观察者'],color:'oklch(72% 0.03 50)',p:{name:'Alan Schaller',handle:'@alan_schaller',bio:'Instagram 53万+  ·  伦敦黑白街头摄影师  ·  Leica大使'},mbti:['INTP','INFJ'],mbtiNote:'内向、思考型、对世界有自己一套独立观察方式——徕卡型那种"我拍的是我的视角"的执念，正是这两种人格最自然的表达。'},
  HASSELBLAD:{name:'哈苏型',en:'HASSELBLAD',tag:'精工作品派',line:'你拍一张照片的架势，像别人做一套毕业设计。',desc:'每一张都要成立，是你对自己的基本要求。你在意质感、层次、留白和完成度。你不一定拍很多，但每一张你都知道自己为什么按快门。',long:'你对"完成度"的标准比大多数人高一档。在你的字典里，一张照片要么成立要么不成立——没有"凑合发了吧"这个选项。这种态度让你拍得慢，但也让你的作品集有一种别人很难复制的厚度。\n\n你重视前期布置，重视后期统一性，重视一组照片之间的内在节奏。你会为了让画面更干净愿意多走两步，为了让色调更准愿意多修一晚。这不是强迫症，是你真的觉得"既然要做就做到对"。\n\n你的限制是有时太追求完美反而错过当下的偶然。但你交出去的每一组作品，都让人感觉到一件事——这个人是认真的。',traits:['作品完成度高','质感敏感','拒绝草率'],color:'oklch(45% 0.03 200)',p:{name:'Elizaveta Porodina',handle:'@elizavetaporodina',bio:'Instagram 60万+  ·  慕尼黑时尚/艺术人像摄影师'},mbti:['INFJ','ISTJ'],mbtiNote:'理想主义但执行严密，对作品完整性有执念——哈苏型那种「每张都得成立」的态度，是这两种人格最接近艺术家的部分。'},
  OLYMPUS:{name:'奥林巴斯型',en:'OLYMPUS',tag:'生活机动派',line:'你的人生里，出门能带上，比参数赢了更重要。',desc:'拍照对你来说是生活的一部分，不是专门安排的仪式。你喜欢旅行、散步、偶遇——轻便是你对器材的第一要求，因为带不出去等于不存在。',long:'你不是不爱拍照，你只是不爱"为了拍照而出门"。在你的逻辑里，相机是生活的一部分，不是一个仪式——它必须能跟着你走，不能给你添麻烦。\n\n你比大多数摄影爱好者出片的频率高，但每张都不是"作品级"的——这恰恰是你强大的地方。你拍的是真实的生活流，是别人为了拍而放弃的那些不起眼瞬间。你的相册更像一本日记，而不是一本作品集。\n\n你对器材的判断标准非常实用——「我会带它出门吗？」回答是肯定，那就是好器材；回答是犹豫，那再强也没意义。这条准则简单但极其有效，让你避免了无数器材陷阱。',traits:['随行随拍','旅行达人','生活融合度高'],color:'oklch(75% 0.07 140)',p:{name:'halno',handle:'@halno',bio:'Instagram 27万+  ·  日本骑扫把旅行摄影师'},mbti:['ESFP','ISFP'],mbtiNote:'体验型、灵活、乐于跟着当下感觉走——奥林巴斯型那种「带着才算」的轻装哲学，是这种人格最自然的拍照方式。'},
  RICOH:{name:'理光型',en:'RICOH',tag:'低调瞬间猎手',line:'你像在随手一拍，实际上已经把今天最对味的一秒收走了。',desc:'你不爱大张旗鼓，拍摄存在感极低。你的反应快过思考，很多时候图已经拍好了你才意识到刚才发生了什么。城市和日常是你永远拍不完的题材。',long:'你拍照时几乎不会被注意到。你的反应快过思考，很多时候照片已经拍完，你才反应过来刚刚那一秒发生了什么。这种反应力不是技术，是一种长期"在看"的本能。\n\n你的相册里没有"拍摄计划"，只有大量看似随手但其实精准的城市切片——一个回头的人，一面有意思的墙，一道刚好的光。你拍的不是事件，是节奏，是城市自己讲故事的方式。\n\n你对"作品感"没什么追求，但你对"对味"非常敏感。一张图对了你心里就咔哒一下，错了再多技术也救不回来。你不太需要别人理解你拍的东西，因为你拍的本来就不是给别人看的。',traits:['即时反应','低存在感','城市切片专家'],color:'oklch(68% 0.04 55)',p:{name:'Juno Morrow',handle:'@juno.morrow',bio:'纽约街头摄影师  ·  Ricoh GR用户  ·  大胆色彩街拍'},mbti:['ISTP','ISFP'],mbtiNote:'低调、敏锐、活在当下、不爱解释——理光型那种"看到就拍、拍完不解释"的反应链路，几乎是这种人格的标准动作。'},
  APPLE:{name:'苹果型',en:'APPLE',tag:'社交美学玩家',line:'你拍照的终点不是相册，是朋友圈和小红书首页。',desc:'你对摄影理论兴趣一般，但对成片好不好看非常敏感。你很清楚自己要什么——好看、能发、有人点赞。这不是肤浅，这是你自己的美学标准。',long:'你对摄影理论没什么兴趣，但你对"什么样的图能火"非常敏感。这不是肤浅——这是一种被严重低估的天赋。能直觉判断一张图在社交平台上的表现，本身就是一种独立的视觉能力。\n\n你拍照效率极高，因为你的标准很清楚：好看、能发、有人共鸣。你不会在一个场景上花太多时间，因为你心里已经有"这次要的是什么"。你的相册更新很快，每张都有用，没有囤货。\n\n你最大的强项是知道自己要什么。这听起来普通，但很多比你"专业"的摄影师恰恰栽在这里——他们拍了一堆好照片，却不知道自己究竟在表达什么。你不会有这种问题。',traits:['社交嗅觉强','人像友好','出片即分享'],color:'oklch(70% 0.05 190)',p:{name:'Austin Mann',handle:'@austinmann',bio:'Instagram 10万+  ·  Apple官方合作iPhone摄影师'},mbti:['ENFJ','ESFP'],mbtiNote:'外向、社交直觉强、天然懂得"什么样的内容能引起共鸣"——苹果型那种「拍完就发、发了就赞」的链路，是这种人格的舒适区。'},
  ANDROID:{name:'安卓型',en:'ANDROID',tag:'大众视角记录者',line:'你不是不会拍，你只是还没把拍照当成需要认真研究的事。',desc:'拍照对你来说是生活功能，不是兴趣爱好。你不纠结器材，不研究风格，主打拍到就行。你代表的是大多数人最真实的状态——这并不是问题。',long:'你拍照是为了功能——记账、记物、发群、传给爸妈。你不会研究构图，不会调色，连竖拍还是横拍都看心情。但你拍出来的东西，反而是这个时代最真实的样本。\n\n这个世界上"会拍照的人"很多，但记录这个时代真实状态的，恰恰是你这种最普通的视角。你的相册没有滤镜，没有设计，没有自我表达——但十年后回头看，你的相册比那些精修过的更动人，因为它没撒谎。\n\n你不需要任何摄影身份认同。你只是在生活，顺便拍了一些。这种心态在摄影爱好者眼里可能有点奢侈——他们花了很多年才学会"放下"，而你从来没有"端起来"过。',traits:['实用主义','随缘记录','普通人视角'],color:'oklch(65% 0.04 160)',p:{name:'普通酱',handle:'(全体普通用户)',bio:'你手机里那个永远糊的朋友',special:true},mbti:['ESTJ','ISTJ'],mbtiNote:'务实、低自我表达需求、把工具当工具——安卓型那种「拍到就行」的态度，是这种人格最经济的处理方式。'},
  DJI:{name:'大疆型',en:'DJI',tag:'上帝视角制造者',line:'到一个地方别人找咖啡店，你找起飞点。',desc:'你的构图天花板是别人的天花板。你用的不是相机，是视角——一个普通人不可能自然拥有的高度。你的画面震撼，因为你愿意为那个角度多花十倍时间。',long:'你天生对"另一个角度"有执念。地面上的风景大家都拍过，那有意思吗？你愿意为了一个普通人不可能自然拥有的视角，多花十倍的时间、十倍的设备成本、十倍的折腾。\n\n你拍出的东西经常会让人「哇」一声——那不只是构图好，那是你提供了一个绝大多数人这辈子不会亲眼看到的世界。这种价值很难复制，因为它不在按快门那一刻，而在你愿不愿意爬到那个位置上。\n\n你的风险是容易陷入"为壮观而壮观"——别忘了，最好的航拍不只是高，而是高得有意义。',traits:['视角颠覆者','航拍达人','大场面控'],color:'oklch(50% 0.06 240)',p:{name:'Elia Locardi',handle:'@elialocardi',bio:'Instagram 30万+  ·  全球旅行航拍摄影师  ·  DJI合作'},mbti:['ENTJ','ENTP'],mbtiNote:'战略型、爱探索新方法、不满足于常规视角——大疆型那种"找到别人没找到的角度"的驱动，是这种人格的本能。'},
  XZLWC:{name:'徐州老味菜型',en:'XZLWC',tag:'混沌拼盘人格',line:'你的摄影人格像一桌乱炖，但偏偏还挺有烟火气。',desc:'今天文艺，明天技术，后天摆烂。你的题材高度随机，风格没有主线，但这恰恰说明你对摄影的态度是真实的——你只是在跟着感觉走。',long:'你的摄影人格不是"没有人格"，而是"全都来一点"。今天文艺，明天技术控，后天纯粹摆烂。你的相册同时存在打鸟、美食、街拍、自拍和一张不知道为什么拍的天花板——但这恰恰说明你对摄影的态度是真实的：你只是在跟着当下的状态走，没有任何人设包袱。\n\n这个测试给到你这个结果，要么是因为你回答得真的非常均衡，要么是因为你本来就是个不愿意被某种风格定义的人。在 11 种风格清晰的摄影人格里，你是唯一一个把"混"当成主线的——这种人很少见，但也很自由。\n\n别把这个结果当成贬义，它更像是一种祝福：你不用活在任何一种摄影身份认同里。你想拍什么就拍什么，想换风格就换，没人能说你"不专业"——因为你压根没在那个游戏里。',traits:['高度随机','烟火气十足','梗感满满'],color:'oklch(75% 0.08 40)',p:{name:'你自己',handle:'@whoever',bio:'你的相册同时有打鸟、美食、街拍、自拍和一张不知道为什么拍的天花板',special:true},mbti:['ENFP','ENTP'],mbtiNote:'兴趣广、不爱被定义、什么都想试一下——徐州老味菜型那种"今天这样明天那样"的混沌感，是这种人格最舒服的状态。'},
};

function cosineSim(a,b){let dot=0,na=0,nb=0;for(let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return na===0||nb===0?0:dot/(Math.sqrt(na)*Math.sqrt(nb));}

function buildMockResult(type) {
  const scores={};
  PROTOS[type].forEach((v,i)=>{ scores[DIM[i]]=Math.round(v/5*DIM_MAX[DIM[i]]*0.8); });
  const nv=DIM.map(d=>scores[d]/DIM_MAX[d]);
  const sims={};
  Object.entries(PROTOS).forEach(([t,p])=>{sims[t]=cosineSim(nv.slice(0,6),p.slice(0,6))*0.7+cosineSim(nv.slice(6),p.slice(6))*0.3;});
  const top3=Object.entries(sims).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,s])=>({type:t,sim:s}));
  return {type,top3,scores};
}

function DimBars({scores}){
  const dims=[{key:'E',label:'情绪表达',max:20},{key:'T',label:'技术掌控',max:20},{key:'S',label:'社交取向',max:15},{key:'M',label:'机动轻便',max:15},{key:'A',label:'仪式审美',max:20},{key:'R',label:'稳定保守',max:15}];
  return(<div style={{display:'flex',flexDirection:'column',gap:10}}>{dims.map(d=>{const val=scores[d.key]||0,pct=Math.min(100,(val/d.max)*100);return(<div key={d.key}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink2)',marginBottom:5}}><span>{d.label}</span><span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:'var(--ink3)'}}>{val}</span></div><div style={{height:5,background:'oklch(91% 0.012 72)',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,var(--accent-border),var(--accent))',borderRadius:99,transition:'width 1s cubic-bezier(0.4,0,0.2,1)'}}/></div></div>);})}</div>);
}

function ResultPage({resultData,onRetry}){
  const{type,top3,scores}=resultData;
  const info=TYPES[type];
  const[showDims,setShowDims]=useState(false);
  const[userImage,setUserImage]=useState(null);
  const[imgRatio,setImgRatio]=useState(3/4);
  useEffect(()=>{setShowDims(false);const t=setTimeout(()=>setShowDims(true),400);return()=>clearTimeout(t);},[type]);
  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',padding:'44px 20px 48px',animation:'fadeIn 0.5s ease both'}}>
      <div style={{textAlign:'center',marginBottom:22}}><span style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:'0.2em',color:'var(--accent)',textTransform:'uppercase'}}>Your Photography Type</span></div>
      <div style={{display:'flex',justifyContent:'center',marginBottom:18}}><img src={'characters/'+type+'.png'} alt={info.name} style={{height:188,width:'auto',objectFit:'contain',filter:'drop-shadow(0 6px 16px oklch(22% 0.02 60 / 0.15))',animation:'scaleIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both'}}/></div>

      <div style={{background:'linear-gradient(145deg,var(--surface),oklch(97% 0.025 72))',border:'1.5px solid var(--accent-border)',borderRadius:24,padding:'28px 24px',marginBottom:14,boxShadow:'var(--shadow-sel)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{width:34,height:34,borderRadius:9,background:info.color,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'DM Mono',monospace",fontSize:9,fontWeight:500,color:'oklch(25% 0.02 60)',letterSpacing:'0.04em'}}>{info.en.slice(0,4)}</div>
          <div><div style={{fontSize:11,color:'var(--ink3)',letterSpacing:'0.06em',marginBottom:2}}>{info.tag}</div><h2 style={{fontSize:22,fontWeight:500,color:'var(--ink)',letterSpacing:'0.03em'}}>{info.name}</h2></div>
        </div>
        <div style={{padding:'13px 15px',background:'oklch(96% 0.02 72)',borderRadius:11,marginBottom:16,borderLeft:'3px solid var(--accent)'}}><p style={{fontSize:13.5,lineHeight:1.75,color:'var(--ink2)',fontStyle:'italic',letterSpacing:'0.02em'}}>{info.line}</p></div>
        <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:16}}>{info.traits.map((t,i)=>(<span key={i} style={{padding:'4px 11px',borderRadius:99,fontSize:12,background:'oklch(93% 0.03 72)',color:'var(--ink2)',border:'1px solid oklch(87% 0.03 72)'}}>{t}</span>))}</div>
        <p style={{fontSize:13.5,lineHeight:1.9,color:'var(--ink2)',letterSpacing:'0.02em',marginBottom:14}}>{info.desc}</p>
        {info.long&&(<div style={{paddingTop:14,borderTop:'1px dashed oklch(85% 0.025 72)'}}>{info.long.split('\n\n').map((para,i)=>(<p key={i} style={{fontSize:13,lineHeight:1.95,color:'var(--ink2)',letterSpacing:'0.02em',marginBottom:i<info.long.split('\n\n').length-1?12:0}}>{para}</p>))}</div>)}
      </div>
      {info.mbti&&(<div style={{background:'var(--surface)',border:'1px solid oklch(91% 0.012 72)',borderRadius:'var(--radius)',padding:'20px 20px',marginBottom:14,boxShadow:'var(--shadow)'}}><div style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--ink3)',marginBottom:14}}>对应 MBTI 人格</div><div style={{display:'flex',gap:8,marginBottom:12}}>{info.mbti.map((m,i)=>(<div key={i} style={{padding:'8px 14px',borderRadius:10,background:'oklch(94% 0.025 72)',border:'1px solid oklch(86% 0.03 72)',fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:500,letterSpacing:'0.08em',color:'var(--ink)'}}>{m}</div>))}</div><p style={{fontSize:12.5,lineHeight:1.85,color:'var(--ink2)',letterSpacing:'0.02em'}}>{info.mbtiNote}</p></div>)}
      <div style={{background:'var(--surface)',border:'1px solid oklch(91% 0.012 72)',borderRadius:'var(--radius)',padding:'20px 20px',marginBottom:14,boxShadow:'var(--shadow)'}}><div style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--ink3)',marginBottom:12}}>风格参考摄影师</div>{info.p.special?(<p style={{fontSize:12,color:'var(--ink3)',fontStyle:'italic',lineHeight:1.7}}>{info.p.bio}</p>):(<div style={{display:'flex',alignItems:'center',gap:12}}><div style={{width:36,height:36,borderRadius:'50%',background:'oklch(93% 0.025 72)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'var(--ink2)',fontWeight:500}}>{info.p.name.slice(0,1)}</div><div><div style={{fontSize:13,fontWeight:500,color:'var(--ink)',marginBottom:2}}>{info.p.name}<span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:'var(--accent)',letterSpacing:'0.05em',marginLeft:8}}>{info.p.handle}</span></div><div style={{fontSize:11,color:'var(--ink3)',letterSpacing:'0.02em'}}>{info.p.bio}</div></div></div>)}</div>
      <div style={{background:'var(--surface)',border:'1px solid oklch(91% 0.012 72)',borderRadius:'var(--radius)',padding:'20px 20px',marginBottom:14,boxShadow:'var(--shadow)'}}><div style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--ink3)',marginBottom:14}}>相似度排名</div><div style={{display:'flex',flexDirection:'column',gap:11}}>{top3.map(({type:t,sim},rank)=>{const ti=TYPES[t],pct=Math.round(sim*100);return(<div key={t}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}><div style={{display:'flex',alignItems:'center',gap:8}}><div style={{width:6,height:6,borderRadius:'50%',background:rank===0?'var(--accent)':'var(--ink3)',flexShrink:0}}/><span style={{fontSize:13,color:rank===0?'var(--ink)':'var(--ink2)',fontWeight:rank===0?500:400}}>{ti.name}</span><span style={{fontSize:11,color:'var(--ink3)'}}>{ti.tag}</span></div><span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:rank===0?'var(--accent)':'var(--ink3)'}}>{pct}%</span></div><div style={{height:4,background:'oklch(93% 0.01 72)',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',width:showDims?pct+'%':'0%',background:rank===0?'linear-gradient(90deg,var(--accent-border),var(--accent))':'oklch(83% 0.03 70)',borderRadius:99,transition:'width 0.9s cubic-bezier(0.4,0,0.2,1)',transitionDelay:(rank*0.12)+'s'}}/></div></div>);})}</div></div>
      <div style={{background:'var(--surface)',border:'1px solid oklch(91% 0.012 72)',borderRadius:'var(--radius)',padding:'20px 20px',marginBottom:14,boxShadow:'var(--shadow)'}}><div style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--ink3)',marginBottom:14}}>人格维度分布</div>{showDims&&<DimBars scores={scores}/>}</div>
      <div style={{background:'var(--surface)',border:'1px solid oklch(91% 0.012 72)',borderRadius:'var(--radius)',padding:'20px 20px',marginBottom:28,boxShadow:'var(--shadow)'}}><div style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--ink3)',marginBottom:16}}>上传你的作品</div><div style={{display:'flex',flexDirection:'column',alignItems:'center'}}><OrnateFrame userImage={userImage} aspectRatio={imgRatio} height={210} onUpload={({src,ratio})=>{setUserImage(src);setImgRatio(ratio);}}/><div style={{marginTop:10,fontSize:10.5,color:'var(--ink3)',fontFamily:"'DM Mono',monospace",letterSpacing:'0.06em'}}>{userImage?'TAP TO REPLACE':'点击相框上传一张你拍过的照片'}</div></div></div>
      <button onClick={onRetry} style={{height:52,borderRadius:14,border:'1.5px solid oklch(85% 0.04 70)',background:'transparent',color:'var(--ink2)',fontSize:15,fontFamily:"'Noto Serif SC',serif",fontWeight:400,letterSpacing:'0.06em',cursor:'pointer',transition:'all 0.2s'}} onMouseEnter={e=>{e.currentTarget.style.background='oklch(95% 0.02 72)';e.currentTarget.style.borderColor='var(--accent-border)';}} onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='oklch(85% 0.04 70)';}}>下一个人格 →</button>
      <div style={{marginTop:32,paddingTop:20,borderTop:'1px dashed oklch(86% 0.02 72)',textAlign:'center'}}><p style={{fontSize:10.5,lineHeight:1.85,color:'var(--ink3)',letterSpacing:'0.04em',fontStyle:'italic'}}>本测试为娱乐性质，不构成对任何品牌、人格或摄影流派的<br/>客观评价。结果仅供参考，请勿当真。</p><p style={{fontSize:11,color:'var(--ink2)',marginTop:12,letterSpacing:'0.03em'}}>有任何想法欢迎联系作者<a href="mailto:wsr_19980225@163.com" style={{color:'var(--accent)',textDecoration:'none',marginLeft:6,fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:'0.04em'}}>wsr_19980225@163.com</a></p><p style={{fontSize:10,color:'var(--ink3)',marginTop:8,fontFamily:"'DM Mono',monospace",letterSpacing:'0.1em',opacity:0.7}}>© CBTI · 2026 · DEV PREVIEW</p></div>
    </div>
  );
}

function App(){
  const[type,setType]=useState('FUJI');
  const keys=Object.keys(TYPES);
  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>
      <div className="dev-bar">
        <label>预览</label>
        <select value={type} onChange={e=>setType(e.target.value)}>
          {keys.map(k=>(<option key={k} value={k}>{TYPES[k].name} · {TYPES[k].tag}</option>))}
        </select>
        <div className="dev-tag">DEV</div>
      </div>
      <ResultPage key={type} resultData={buildMockResult(type)} onRetry={()=>setType(keys[(keys.indexOf(type)+1)%keys.length])}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
